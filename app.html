    me:{"name": "George P. Burdell", "role": "Student", "title": "Undergraduate Student · Enrolled since 1927", "unit": "Georgia Institute of Technology", "headline": "Enrolled since 1927. Still not done learning.", "skills": ["course registration", "campus traditions", "orientation", "student life", "test taking", "football", "basketball"], "interests": ["graduating eventually", "student radio", "magazine publishing", "swimming and diving"], "about": "I enrolled at Georgia Tech in 1927, when Ed Smith received two enrollment forms by mistake and decided the second one should go to me. I signed up for every class he took, he did all the schoolwork twice, and every test got turned in under both of our names. By 1930 I had a bachelor's degree, and a master's followed a few years later. The Institute lists me as an alumnus, but my name has never left the active student rolls.\n\nSince then I have kept busy. I flew 12 missions over Europe on a B-17 with the 8th Air Force, got engaged to Ramona Cartwright of Agnes Scott College in 1958, and lettered in football (1928 to 1930) and basketball (1956 to 1958). When Tech computerized class registration in 1969, I ended up registered for every class at the school that quarter, over 3,000 credit hours.\n\nI also served on Mad Magazine's board of directors from 1969 to 1981, led the online poll for Time's 2001 Person of the Year, and I am still listed on the WREK staff. Every new Yellow Jacket hears about me at orientation, so if you are new here, consider this my official welcome.", "motto": "Work hard, have fun, and never take yourself too seriously. That is the Georgia Tech way.", "projects": ["Earning every undergraduate degree Georgia Tech offers", "Staying on the active student rolls since 1927", "Staff member at WREK, Georgia Tech student radio", "Welcoming new students at orientation every year", "Cheering on George P. Burdell Jr., proctor for several Tech classes"], "favs": [["Year I enrolled", "1927, thanks to Ed Smith     xavier:{"name": "Dr. Charles Xavier", "cred": "Ph.D.", "role": "Faculty", "partner": true, "title": "Tenured Professor of Mutant Biology and Sociology", "unit": "Georgia Institute of Technology", "headline": "Every gift deserves a teacher. Every student deserves a place to belong.", "skills": ["mutant biology", "sociology", "genetics", "telepathy", "mentoring", "leadership", "ethics", "strategic planning"], "interests": ["peaceful coexistence", "student support", "research tools", "conflict resolution"], "about": "I am a tenured professor at Georgia Tech, where I teach mutant biology and sociology. I also founded and run the Xavier School for Gifted Youngsters, a private school that gives young mutants from around the world a safe place to learn, grow, and understand their abilities. In both settings I teach students how their powers work, how to control them responsibly, and how to navigate the relationships between mutants and humans.\n\nMy research draws on a lifelong interest in genetics. I apply that work to build tools like Cerebro, which helps us find and reach young mutants who need support. My teaching goes beyond conventional subjects to include ethics, leadership, and strategic thinking, preparing students to protect both mutants and humanity as members of the X-Men.\n\nI see teaching and advocacy as one mission. My hope is that every student leaves my classroom with the skills, judgment, and compassion to help build a world where mutants and humans live side by side.", "motto": "Lead with understanding, teach with patience, and never stop working toward peaceful coexistence.", "projects": ["Tenured faculty, Georgia Institute of Technology", "Founder and headmaster, Xavier School for Gifted Youngsters", "Cerebro: research tool to detect and connect with mutants worldwide", "Mentoring the X-Men in ethics, leadership, and strategy", "Advocating for mutant and human coexistence"], "favs": [["Subjects I teach", "Mutant biology, sociology, genetics, and et     finaid:{"name": "Renee Holloway", "cred": "M.Ed.", "role": "Staff", "title": "Director of Financial Aid", "unit": "Office of Scholarships and Financial Aid", "headline": "Helping every Yellow Jacket find a way to pay for a Georgia Tech education.", "skills": ["financial aid", "fafsa", "scholarships", "federal grants", "student loans", "work-study", "academic progress appeals", "emergency funding"], "interests": ["process improvement", "data dashboards", "student success"], "about": "I lead the team that helps students and families plan for and pay for a Georgia Tech education. That covers federal and state aid, institutional scholarships, student loans, Federal Work-Study, and emergency funding when life happens mid-semester.\n\nMost of my work happens behind the scenes: reviewing aid packages, keeping us compliant with federal rules, and partnering with the Registrar, the Bursar, and academic departments so aid arrives when students need it. I am always looking for steps in our process that confuse students, and for ways to explain them more simply.\n\nIf you are a student with a question about your aid, or a staff member who keeps hearing the same question from students, I want to hear from you.", "motto": "No student should leave Tech because of a form they did not understand.", "projects": ["Simplifying the financial aid award letter", "Aligning aid disbursement timing with the Registrar and Bursar", "Expanding emergency funding for students", "Training advisors on academic progress appeals", "FAFSA completion workshops for incoming students"], "favs": [["Busiest season", "When the FAFSA opens, and the weeks before fall tuition is due"], ["Best part of the job", "Telling a student their funding gap is covered"], ["Advice I give most", "Apply early, read every message from our office, and ask questions"], ["Something I value", "Clear answers and kindness"]]},

  posts:[
    p('p1','Travel & Expense','Travel reimbursement returned twice for "missing documentation". What is actually required?','dana',3*d,47,9,['reimbursement','receipts','conference travel'],
      'Get a faculty member reimbursed for a conference trip: airfare, hotel and registration.',
      'The report came back twice with the note "missing documentation" and no detail. A colleague in another school says their approver accepts the registration confirmation email; ours asked for an itemized receipt.',
      'Resubmitted with the confirmation email attached. Emailed the approver and have not heard back.',
      [r('r1','priya','This usually comes back for one of three reasons. Check these before you resubmit:\n1. Registration needs an itemized receipt showing payment, not the confirmation email.\n2. The hotel folio has to show a zero balance and the traveler\'s name.\n3. Attach the conference agenda so the travel dates can be matched to the event.',31,true,2*d),
       r('r2','james','Same thing in our school last spring. We now ask travelers for the itemized receipt before they leave, which cut our returned reports to almost none. Happy to share the pre-trip email we send.',12,false,2*d-h),
       r('r3','sam','From the traveler side: I never knew the confirmation email was not enough. If the return note listed which item was missing, I could fix it in one pass.',19,false,d)],
      {elevated:true}),
    p('p2','Hiring & Onboarding','New student assistant waited three weeks for system access after the start date','marcus',7*d,33,6,['onboarding','system access','student hiring'],
      'Bring a student assistant on board so they can start work on day one.',
      'The hire was approved on time, but access requests had to be filed separately in three places and nobody told us about two of them.',
      'Filed each request as we discovered it. Asked our admin whether one checklist covers all of them.',
      [r('r4','james','We keep a one-page onboarding checklist that lists every access request with who files it and how long it takes. File all of them the day the offer is accepted, not the start date.',14,true,6*d)]),
    p('p3','Student Services','Which office signs the course substitution form? I have been sent to four.','aisha',2*d,21,4,['forms','signatures','degree requirements'],
      'Get a course substitution approved so it counts toward my degree.',
      'Each office says the next one owns the signature.',
      'Visited my advisor, the school office, the registrar and the college office.',
      [r('r5','sam','In our school the program director signs first and the advisor second. I do not know if that holds elsewhere.',3,false,d)]),
    p('p4','Purchasing','Our department built its own purchase request tracker. Has anyone else already solved this?','luis',5*d,18,7,['purchase requests','tracker','templates'],
      'Track purchase requests from submission to delivery without rebuilding a spreadsheet every year.',
      'We suspect three other units have a version of the same spreadsheet and none of us know about the others.',
      'Built our own. Happy to share it and compare notes.',
      [r('r6','priya','Two units have shared their trackers in this thread. I combined the columns both use into one template so new units can start from it.',9,true,4*d)]),
    p('p5','Facilities & Space','Room reservation approvals routed to the wrong office','sam',20*d,14,5,['room reservations','routing'],
      'Reserve a shared classroom for an evening review session.',
      'Requests for our building went to an office that no longer manages it, then sat unanswered.',
      'Called the old office, who forwarded it by hand each time.',
      [r('r7','priya','The routing list was updated after this was elevated. Requests for the affected buildings now go to the current owner.',11,true,6*d)],
      {elevated:true,improved:true}),
    p('p6','IT & Access','Shared mailbox access disappears every time someone changes roles','james',9*d,9,3,['shared mailbox','system access','role changes'],

      'Access is removed on the role change and has to be requested again from scratch.',
      'Re-requested each time. Takes about a week.',[]),
    p('p7','Travel & Expense','Expense report returned with no explanation','dana',5*h,1,1,['reimbursement','expense report'],

function feedList(){

document.addEventListener('change',function(e){
  if(e.target.id!=='pf-photo') return;
  var file=e.target.files&&e.target.files[0]; if(!file) return;
  if(!/^image\//.test(file.type)){ toast('Choose an image file'); return; }
  readPhoto(file,function(url){ if(!url){ toast('That image could not be read'); return; } ui.photo=url; refreshPhotoBox(); });
  e.target.value='';
});
function fromHash(){
  var h=(location.hash||'').replace('#','');
  if(h.indexOf('t-')===0&&post(h.slice(2))){ui.view='thread'; ui.id=h.slice(2);}
  else if(h.indexOf('u-')===0&&S.people[h.slice(2)]){ui.view='person'; ui.id=h.slice(2);}
  else if(['new','dash','feed','network','me','search','tools'].indexOf(h)>-1){ui.view=h; ui.id=null;}
  if(ui.view==='dash'&&!isPartner()) ui.view='feed';
}
window.addEventListener('hashchange',function(){fromHash(); render();});
fromHash(); render();
})();
</script>
